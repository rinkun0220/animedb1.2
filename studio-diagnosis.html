  kai: {
    name: "スタジオKAI",
    desc: "あなたに一番近いのはスタジオKAIです。音楽・アイドル・パフォーマンス系の作品を中心に、ライブ感あふれる映像を手掛ける制作会社。作品世界にどっぷり浸れるエンタメを求めるタイプです。",
    works: "代表作：ウマ娘 プリティーダービー シリーズ　など",
    official: "https://st-kai.jp/"
  },
  bind: {
    name: "スタジオバインド",
    desc: "あなたに一番近いのはスタジオバインドです。原作の世界観を長期的・計画的に、丁寧に作り込む誠実な姿勢が持ち味の制作会社。じっくり積み上げた末の納得感を大事にするタイプです。",
    works: "代表作：無職転生 〜異世界行ったら本気だす〜　など",
    official: "https://st-bind.jp/"
  }
};

let currentQ = 0;
let scores = { pawoks: 0, kyoani: 0, cloverworks: 0, a1: 0, wit: 0, mappa: 0, ghibli: 0, toei: 0, ufotable: 0, sunrise: 0, bones: 0, madhouse: 0, trigger: 0, saru: 0, kai: 0, bind: 0 };

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  currentQ = 0;
  scores = { pawoks: 0, kyoani: 0, cloverworks: 0, a1: 0, wit: 0, mappa: 0, ghibli: 0, toei: 0, ufotable: 0, sunrise: 0, bones: 0, madhouse: 0, trigger: 0, saru: 0, kai: 0, bind: 0 };
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressBar').style.width = ((currentQ) / questions.length * 100) + '%';
  const optsHtml = q.options.map((opt, i) =>
    `<button class="q-opt" onclick="selectOption(${i})">${opt.label}</button>`
  ).join('');
  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options">${optsHtml}</div>
    </div>
  `;
}

function selectOption(i) {
  const opt = questions[currentQ].options[i];
  for (const key in opt.scores) {
    scores[key] += opt.scores[key];
  }
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const topKey = ranked[0];
  const otherKeys = ranked.slice(1);
  const r = results[topKey];
  const othersHtml = otherKeys.map(k => {
    const o = results[k];
    return `<a href="${o.official}" target="_blank" rel="noopener" class="other-studio-item">
      <span class="other-studio-name">${o.name}</span>
      <span class="other-studio-arrow">公式サイト →</span>
    </a>`;
  }).join('');
  const primaryBtnHtml = r.anchor
    ? `<a href="/blog/studio-favorites.html#${r.anchor}" class="result-btn primary">代表作をもっと見る →</a>`
    : `<a href="${r.official}" target="_blank" rel="noopener" class="result-btn primary">公式サイトを見る →</a>`;
  const shareText = encodeURIComponent(`私に合う制作会社は「${r.name}」でした！ #ANIMEDB制作会社診断`);
  const shareUrl = encodeURIComponent('https://anime-db.jp/studio-diagnosis.html');
  const shareHtml = `<a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="result-btn share">𝕏 結果をシェア</a>`;
  document.getElementById('resultScreen').innerHTML = `
    <div class="result-card">
      <div class="result-label">あなたにおすすめの制作会社は…</div>
      <div class="result-name">${r.name}</div>
      <div class="result-desc">${r.desc}</div>
      <div class="result-works">${r.works}</div>
      <div class="result-btns">
        ${primaryBtnHtml}
        ${shareHtml}
        <button class="result-btn secondary" onclick="restartQuiz()">もう一度診断する</button>
      </div>
    </div>
    <div class="other-studios-card">
      <div class="other-studios-title">🎬 この制作会社を選んだあなたには、こちらもおすすめ</div>
      <div class="other-studios-list">${othersHtml}</div>
    </div>
  `;
  document.getElementById('resultScreen').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  startQuiz();
}
</script>

</body>
</html>
