<style>

#startScreen, #resultScreen { text-align: center; }
.start-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; padding: 16px 44px; cursor: pointer; transition: background 0.2s; font-family: inherit; }
.start-btn:hover { background: var(--accent-hover); }

.result-card { background: var(--bg-card); border: 2px solid var(--accent); border-radius: 18px; padding: 36px 28px; margin-bottom: 24px; }
.result-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
.result-name { font-size: 1.7rem; font-weight: 800; color: #fff; margin-bottom: 16px; }
.result-desc { font-size: 0.94rem; color: var(--text-main); line-height: 1.9; margin-bottom: 20px; text-align: left; }
.result-works { font-size: 0.82rem; color: var(--text-muted); background: var(--bg-darker); border-radius: 8px; padding: 12px 16px; text-align: left; margin-bottom: 20px; }
.result-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.result-btn { display: inline-block; padding: 12px 26px; border-radius: 8px; font-size: 0.92rem; font-weight: 700; text-decoration: none; }
.result-btn.primary { background: var(--accent); color: #fff; }
.result-btn.secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; }

.other-studios-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; text-align: left; }

.other-studio-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-darker); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; text-decoration: none; transition: border-color 0.2s; }
.other-studio-item:hover { border-color: var(--star-color); }
.other-studio-name { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }

<main>

    <p class="page-desc">5つの質問に答えるだけで、あなたの好みに一番近いアニメ制作会社がわかります。所要時間は約1分です。</p>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div id="startScreen">
    <div class="q-card">
      <p style="font-size:0.95rem; color:var(--text-muted); margin-bottom:24px; line-height:1.9;">P.A.WORKS・京都アニメーション・CloverWorks・A-1 Pictures・wit studio・MAPPA。<br>あなたの"好き"は、どの制作会社に近いでしょうか？</p>
      <button class="start-btn" onclick="startQuiz()">診断をはじめる →</button>
    </div>

<script>
const questions = [
  {
    text: "好きなアニメのジャンルは？",
    options: [
      { label: "日常・青春もの", scores: { pawoks: 3, kyoani: 2 } },
      { label: "感動系のヒューマンドラマ", scores: { kyoani: 3, pawoks: 2 } },
      { label: "ダークファンタジー・シリアスなバトル", scores: { wit: 3, mappa: 2 } },
      { label: "熱いバトル・アクション", scores: { mappa: 3, a1: 2 } }
    ]
  },
  {
    text: "アニメを見るときに一番惹かれるのは？",
    options: [
      { label: "キャラクターの繊細な感情表現", scores: { kyoani: 3, cloverworks: 1 } },
      { label: "圧倒的な作画・演出のクオリティ", scores: { kyoani: 2, wit: 2, mappa: 2 } },
      { label: "王道で派手なストーリー展開", scores: { a1: 3 } },
      { label: "今っぽい、洗練された雰囲気", scores: { cloverworks: 3 } }
    ]
  },
  {
    text: "好きな物語の舞台は？",
    options: [
      { label: "地方の田舎町・小さなコミュニティ", scores: { pawoks: 3 } },
      { label: "学校・青春の日常", scores: { kyoani: 2, cloverworks: 2 } },
      { label: "異世界・ファンタジー世界", scores: { a1: 2, wit: 2 } },
      { label: "過酷な戦場・サバイバル", scores: { wit: 3, mappa: 2 } }
    ]
  },
  {
    text: "一番刺さる展開はどれですか？",
    options: [
      { label: "静かな余韻を残すラスト", scores: { pawoks: 3, kyoani: 2 } },
      { label: "予測不能などんでん返し", scores: { mappa: 2, wit: 2 } },
      { label: "スカッとする爽快な勝利", scores: { a1: 3 } },
      { label: "スタイリッシュでおしゃれな演出", scores: { cloverworks: 3 } }
    ]
  },
  {
    text: "あなたにとってアニメとは？",
    options: [
      { label: "心を癒してくれるもの", scores: { pawoks: 3 } },
      { label: "芸術として楽しむもの", scores: { kyoani: 3 } },
      { label: "熱狂できるエンタメ", scores: { mappa: 2, a1: 2 } },
      { label: "新しい価値観に触れるもの", scores: { cloverworks: 2, wit: 2 } }
    ]
  }
];

const results = {
  pawoks: {
    name: "P.A.WORKS",
    desc: "あなたに一番近いのはP.A.WORKSです。地方を舞台にした日常や、じんわりと心に残る人間ドラマを丁寧に描くのが持ち味の制作会社。派手さより、静かな余韻や登場人物の生活感を大切にしたい人にぴったりです。",
    works: "代表作：true tears／花咲くいろは／SHIROBAKO　など",
    anchor: "pawoks",
    official: "https://www.pa-works.jp/"
  },
  kyoani: {
    name: "京都アニメーション",
    desc: "あなたに一番近いのは京都アニメーションです。圧倒的な作画クオリティと、キャラクターの表情・仕草まで作り込まれた繊細な演出が持ち味。感情表現の緻密さで魅せる作品が好きな人に向いています。",
    works: "代表作：響け！ユーフォニアム／涼宮ハルヒの憂鬱／京アニ作品全般",
    anchor: "kyoani",
    official: "https://www.kyotoanimation.co.jp/"
  },
  cloverworks: {
    name: "CloverWorks",
    desc: "あなたに一番近いのはCloverWorksです。ジャンルを問わず幅広く手掛け、どこか今っぽく洗練された空気感を作るのが得意な制作会社。新しい感性のアニメを求める人にぴったりです。",
    works: "代表作：SPY×FAMILY／その着せ替え人形は恋をする　など",
    anchor: "cloverworks",
    official: "https://cloverworks.co.jp/"
  },
  a1: {
    name: "A-1 Pictures",
    desc: "あなたに一番近いのはA-1 Picturesです。大型IPを派手な演出で見せる、王道エンタメの安定感が持ち味の制作会社。スカッとする展開やわかりやすい面白さを求める人に向いています。",
    works: "代表作：ソードアート・オンライン／四月は君の嘘　など",
    anchor: "a1",
    official: "https://www.a1p.jp/"
  },
  wit: {
    name: "wit studio",
    desc: "あなたに一番近いのはwit studioです。緊張感のあるダークな世界観と、息をのむようなアクション演出が持ち味の制作会社。じっくり見せる重厚なシリアス作品が好きな人にぴったりです。",
    works: "代表作：進撃の巨人（1〜3期）／甲鉄城のカバネリ　など",
    anchor: "wit",
    official: "https://www.witstudio.co.jp/"
  },
  mappa: {
    name: "MAPPA",
    desc: "あなたに一番近いのはMAPPAです。原作の熱量をそのまま画面にぶつけるような、ハイテンションな作画と演出が持ち味の制作会社。ダークな世界観のバトルものを全力で楽しみたい人に向いています。",
    works: "代表作：呪術廻戦／チェンソーマン／進撃の巨人 The Final Season",
    anchor: "mappa",
    official: "https://www.mappa.co.jp/"
  }
};

let currentQ = 0;
let scores = { pawoks: 0, kyoani: 0, cloverworks: 0, a1: 0, wit: 0, mappa: 0 };

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  currentQ = 0;
  scores = { pawoks: 0, kyoani: 0, cloverworks: 0, a1: 0, wit: 0, mappa: 0 };
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressBar').style.width = ((currentQ) / questions.length * 100) + '%';
  const optsHtml = q.options.map((opt, i) =>
    `<button class="q-opt" onclick="selectOption(${i})">${opt.label}</button>`
  ).join('');
  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options">${optsHtml}</div>
    </div>
  `;
}

function selectOption(i) {
  const opt = questions[currentQ].options[i];
  for (const key in opt.scores) {
    scores[key] += opt.scores[key];
  }
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const topKey = ranked[0];
  const otherKeys = ranked.slice(1, 4);
  const r = results[topKey];
  const othersHtml = otherKeys.map(k => {
    const o = results[k];
    return `<a href="${o.official}" target="_blank" rel="noopener" class="other-studio-item">
      <span class="other-studio-name">${o.name}</span>
      <span class="other-studio-arrow">公式サイト →</span>
    </a>`;
  }).join('');
  document.getElementById('resultScreen').innerHTML = `
    <div class="result-card">
      <div class="result-label">あなたにおすすめの制作会社は…</div>
      <div class="result-name">${r.name}</div>
      <div class="result-desc">${r.desc}</div>
      <div class="result-works">${r.works}</div>
      <div class="result-btns">
        <a href="/blog/studio-favorites.html#${r.anchor}" class="result-btn primary">代表作をもっと見る →</a>
        <button class="result-btn secondary" onclick="restartQuiz()">もう一度診断する</button>
      </div>
    </div>
    <div class="other-studios-card">
      <div class="other-studios-title">🎬 この制作会社を選んだあなたには、こちらもおすすめ</div>
      <div class="other-studios-list">${othersHtml}</div>
    </div>
  `;
  document.getElementById('resultScreen').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  startQuiz();
}
</script>

</body>
