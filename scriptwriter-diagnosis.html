<script>
const questions = [
  {
    text: "好きなアニメの空気感は？",
    options: [
      { label: "何気ない日常の空気感", scores: { yoshida: 3 } },
      { label: "感情がむき出しになる痛みや後悔", scores: { okada: 3 } },
      { label: "テンポの良いコメディ・ラブコメ", scores: { hanada: 3 } },
      { label: "長期シリーズをしっかり畳む安定感", scores: { yokote: 3 } },
      { label: "緩急のあるシリーズ構成そのものの巧さ", scores: { aoshima: 3 } }
    ]
  },
  {
    text: "一番惹かれる脚本の魅力は？",
    options: [
      { label: "キャラ同士のさりげない会話劇", scores: { yoshida: 3 } },
      { label: "感情の爆発、いわゆる"エモさ"", scores: { okada: 3 } },
      { label: "原作ものの「間」の作り方", scores: { hanada: 3 } },
      { label: "破綻させずに畳む構成力", scores: { yokote: 3 } },
      { label: "キャラの魅力を引き出す話の並び順", scores: { aoshima: 3 } }
    ]
  },
  {
    text: "好きなジャンルは？",
    options: [
      { label: "日常もの", scores: { yoshida: 3, aoshima: 1 } },
      { label: "青春群像劇", scores: { okada: 3 } },
      { label: "ラブコメ・原作コメディ", scores: { hanada: 3 } },
      { label: "シリアスからキッズ向けまでいろいろ", scores: { yokote: 3 } }
    ]
  },
  {
    text: "アニメに求めるものは？",
    options: [
      { label: "落ち着いた空気感", scores: { yoshida: 3 } },
      { label: "感情を揺さぶられる痛み", scores: { okada: 3 } },
      { label: "気軽に笑えるテンポ", scores: { hanada: 3 } },
      { label: "安定した安心感のある構成", scores: { yokote: 3 } },
      { label: "気づいたら夢中になっている構成の妙", scores: { aoshima: 3 } }
    ]
  },
  {
    text: "一番好きな読後感は？",
    options: [
      { label: "じんわり優しい余韻", scores: { yoshida: 3 } },
      { label: "胸が締め付けられる余韻", scores: { okada: 3 } },
      { label: "楽しかった、で終われる軽さ", scores: { hanada: 3 } },
      { label: "満足のいく完結感", scores: { yokote: 3 } },
      { label: "もう一度見返したくなる構成美", scores: { aoshima: 3 } }
    ]
  }
];

const results = {
  yoshida: {
    name: "吉田玲子",
    desc: "あなたに一番近いのは吉田玲子です。日常の空気感と、キャラクター同士のさりげない会話を書かせたら随一の脚本家。派手な事件がなくても飽きさせない、いわゆる「日常もの」の名手というイメージが強いタイプです。",
    works: "代表作：けいおん!　など",
    anchor: "yoshida",
    official: "https://x.com/yoshida_1967"
  },
  okada: {
    name: "岡田麿里",
    desc: "あなたに一番近いのは岡田麿里です。感情のむき出し方が独特で、いわゆる「エモい」を体現するような脚本家。青春の痛みや後悔を容赦なく描く作風に強く惹かれるタイプです。",
    works: "代表作：あの日見た花の名前を僕達はまだ知らない。　など",
    anchor: "okada"
  },
  hanada: {
    name: "花田十輝",
    desc: "あなたに一番近いのは花田十輝です。テンポの良いコメディとラブコメを量産し続けている脚本家。原作ものの「間」の作り方が上手く、キャラの掛け合いが小気味良い作風に惹かれるタイプです。",
    works: "代表作：宇宙よりも遠い場所　など",
    anchor: "hanada",
    official: "https://x.com/oitan125"
  },
  yokote: {
    name: "横手美智子",
    desc: "あなたに一番近いのは横手美智子です。シリアスからキッズ向けまで守備範囲が異様に広い脚本家。長期シリーズの構成を任されることが多く、物語を破綻させずに畳む手腕に定評があるタイプに惹かれます。",
    works: "代表作：SHIROBAKO　など",
    anchor: "yokote"
  },
  aoshima: {
    name: "あおしまたかし",
    desc: "あなたに一番近いのはあおしまたかしです。日常コメディの脚本・シリーズ構成を数多く手がける脚本家。キャラクターの魅力を引き出す話の並び順や緩急の作り方に、構成の妙を感じるタイプです。",
    works: "代表作：みつどもえ　など",
    anchor: "aoshima"
  }
};

let currentQ = 0;
let scores = { yoshida: 0, okada: 0, hanada: 0, yokote: 0, aoshima: 0 };

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  currentQ = 0;
  scores = { yoshida: 0, okada: 0, hanada: 0, yokote: 0, aoshima: 0 };
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressBar').style.width = ((currentQ) / questions.length * 100) + '%';
  const optsHtml = q.options.map((opt, i) =>
    `<button class="q-opt" onclick="selectOption(${i})">${opt.label}</button>`
  ).join('');
  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options">${optsHtml}</div>
    </div>
  `;
}

function selectOption(i) {
  const opt = questions[currentQ].options[i];
  for (const key in opt.scores) {
    scores[key] += opt.scores[key];
  }
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const topKey = ranked[0];
  const otherKeys = ranked.slice(1);
  const r = results[topKey];
  const othersHtml = otherKeys.map(k => {
    const o = results[k];
    return `<a href="/blog/scriptwriter-favorites.html#${o.anchor}" class="other-item">
      <span class="other-name">${o.name}</span>
      <span class="other-arrow">代表作を見る →</span>
    </a>`;
  }).join('');

  const shareText = encodeURIComponent(`私に合う脚本家は「${r.name}」でした！ #ANIMEDB脚本家診断`);
  const shareUrl = encodeURIComponent('https://anime-db.jp/scriptwriter-diagnosis.html');

  document.getElementById('resultScreen').innerHTML = `
    <div class="result-card">
      <div class="result-label">あなたに合う脚本家は…</div>
      <div class="result-name">${r.name}</div>
      <div class="result-desc">${r.desc}</div>
      <div class="result-works">${r.works}</div>
      <div class="result-btns">
        <a href="/blog/scriptwriter-favorites.html#${r.anchor}" class="result-btn primary">代表作をもっと見る →</a>
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="result-btn share">𝕏 結果をシェア</a>
        <button class="result-btn secondary" onclick="restartQuiz()">もう一度診断する</button>
      </div>
    </div>
    <div class="other-card">
      <div class="other-title">✍️ この脚本家を選んだあなたには、こちらもおすすめ</div>
      <div class="other-list">${othersHtml}</div>
    </div>
  `;
  document.getElementById('resultScreen').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  startQuiz();
}
</script>

</body>
