const categoryPrompt = {
  "声優": "この役を演じている声優は？",
  "脚本家": "この作品の脚本を手がけたのは？",
  "監督": "この作品を監督したのは？",
  "制作会社": "この作品を制作したのは？",
  "アーティスト": "この作品の主題歌を担当したのは？"
};

const TOTAL_QUESTIONS = 10;
let quizSet = [];
let currentQ = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuizSet() {
  quizSet = shuffle(pool).slice(0, TOTAL_QUESTIONS);
}

function getDistractors(correct, count) {
  const sameCat = pool.filter(p => p.category === correct.category && p.name !== correct.name);
  const others = pool.filter(p => p.category !== correct.category && p.name !== correct.name);
  const candidates = shuffle(sameCat).concat(shuffle(others));
  const picked = [];
  const usedNames = new Set([correct.name]);
  for (const c of candidates) {
    if (picked.length >= count) break;
    if (usedNames.has(c.name)) continue;
    usedNames.add(c.name);
    picked.push(c);
  }
  return picked;
}

function startQuiz() {
  buildQuizSet();
  currentQ = 0;
  score = 0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  document.getElementById('progressBar').style.width = (currentQ / TOTAL_QUESTIONS * 100) + '%';
  const q = quizSet[currentQ];
  const distractors = getDistractors(q, 3);
  const options = shuffle([q, ...distractors]);

  const optsHtml = options.map((opt, i) =>
    `<button class="q-opt" id="opt-${i}" onclick="selectAnswer(${i}, '${opt.name.replace(/'/g, "\\'")}')">${opt.name}</button>`
  ).join('');

  const roleHtml = q.role ? `<div class="q-hint-role">${q.role}</div>` : '';

  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${TOTAL_QUESTIONS}　（正解数：${score}）</div>
      <span class="q-category">${q.category}</span>
      <div class="q-hint-title">${q.work}</div>
      <div class="q-hint-sub">${q.genre}</div>
      ${roleHtml}
      <div class="q-prompt">${categoryPrompt[q.category]}</div>
      <div class="q-options" id="qOptions">${optsHtml}</div>
      <div class="q-feedback" id="qFeedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
    </div>
  `;
  window._currentOptions = options;
}

function selectAnswer(idx, name) {
  if (answered) return;
  answered = true;
  const q = quizSet[currentQ];
  const isCorrect = name === q.name;
  const buttons = document.querySelectorAll('.q-opt');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (window._currentOptions[i].name === q.name) {
      btn.classList.add('correct');
    } else if (i === idx && !isCorrect) {
      btn.classList.add('wrong');
    }
  });
  const feedback = document.getElementById('qFeedback');
  if (isCorrect) {
    score++;
    feedback.innerHTML = `✅ 正解！ <a href="/blog/${q.link}#${q.id}" target="_blank" rel="noopener" style="color:var(--star-color);">→ ${q.name}の代表作をもっと見る</a>`;
  } else {
    feedback.innerHTML = `❌ 不正解。正解は「${q.name}」でした。 <a href="/blog/${q.link}#${q.id}" target="_blank" rel="noopener" style="color:var(--star-color);">→ もっと見る</a>`;
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
  currentQ++;
  if (currentQ < TOTAL_QUESTIONS) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  let emoji, comment;
  const rate = score / TOTAL_QUESTIONS;
  if (rate >= 0.9) { emoji = '🏆'; comment = 'ほぼ全問正解！ANIMEDBマスター認定です。'; }
  else if (rate >= 0.7) { emoji = '🎉'; comment = 'かなりの正解率！名鑑をよく見ていますね。'; }
  else if (rate >= 0.4) { emoji = '👍'; comment = 'まずまずの結果。名鑑を見返せばもっと伸ばせます。'; }
  else { emoji = '📖'; comment = 'これを機に名鑑をチェックしてみましょう。'; }

  const shareText = encodeURIComponent(`「この人は誰？」クイズで${score}/${TOTAL_QUESTIONS}問正解でした！ #ANIMEDBクイズ`);
  const shareUrl = encodeURIComponent('https://anime-db.jp/who-is-this.html');

  document.getElementById('resultScreen').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${score} / ${TOTAL_QUESTIONS} 問正解</div>
      <div class="result-comment">${comment}</div>
      <div class="result-btns">
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="result-btn" style="background:#000;color:#fff;border:1px solid #333;">𝕏 結果をシェア</a>
        <button class="result-btn primary" onclick="startQuiz()">もう一度挑戦する</button>
        <a href="/directory.html" class="result-btn secondary">名鑑を見る</a>
      </div>
    </div>
  `;
  document.getElementById('resultScreen').classList.remove('hidden');
}
