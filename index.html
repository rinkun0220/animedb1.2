<style>
:root {
  --bg-main: #0b0f19;
  --bg-card: #161f30;
  --bg-darker: #070a10;
  --accent: #ff4757;
  --accent-hover: #ff6b81;
  --text-main: #f1f2f6;
  --text-muted: #a4b0be;
  --star-color: #ffa502;
  --border-color: rgba(255,255,255,0.08);
  --nav-height: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Sans JP', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

/* 修正2：モーダルオーバーレイのCSS拡張 */
#modalOv {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(4,6,10,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999 !important;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#modalOv.open { display: flex; opacity: 1; }

.modal-body {
  background: var(--bg-card);
  width: 90%; max-width: 760px;
  border-radius: 16px;
  border: 1px solid var(--border-color);
  overflow: hidden;
  position: relative;
  cursor: default;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  transform: translateY(20px);
  transition: transform 0.3s ease;
}
#modalOv.open .modal-body { transform: translateY(0); }

.m-close-btn {
  position: absolute; top: 16px; right: 16px;
  background: rgba(0,0,0,0.5); border: none;
  color: #fff; width: 36px; height: 36px;
  border-radius: 50%; font-size: 20px;
  cursor: pointer; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.m-close-btn:hover { background: var(--accent); }

.video-container {
  position: relative; width: 100%; padding-top: 56.25%;
  background: #000;
}
.video-container iframe {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
}
.m-info-block { padding: 24px; max-height: 250px; overflow-y: auto; }
.m-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
.m-synopsis { font-size: 0.95rem; color: var(--text-muted); }

/* ヘッダー */
header {
  height: var(--nav-height);
  background: rgba(11,15,25,0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; position: fixed; top: 0; width: 100%; z-index: 100;
}
.logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; cursor: pointer; }
.logo-a { color: #fff; }
.logo-db { color: var(--accent); }
.nav-links { display: flex; gap: 20px; }
.nav-item {
  color: var(--text-muted); text-decoration: none; font-size: 0.95rem;
  font-weight: 500; cursor: pointer; transition: color 0.2s;
  padding: 8px 12px; border-radius: 6px;
}
.nav-item:hover, .nav-item.active { color: #fff; background: rgba(255,255,255,0.05); }

/* メインコンテンツ */
main { margin-top: var(--nav-height); padding: 24px; max-width: 1400px; margin-left: auto; margin-right: auto; }
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ヒーローセクション */
.hero-slider { margin-bottom: 40px; border-radius: 16px; overflow: hidden; position: relative; height: 380px; background: var(--bg-darker); }
.hero-item { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; display: flex; align-items: flex-end; }
.hero-item.active { opacity: 1; z-index: 1; }
.hero-bg { position: absolute; top:0; left:0; width:100%; height:100%; background-size: cover; background-position: center; filter: brightness(0.4) blur(2px); }
.hero-content { position: relative; z-index: 2; padding: 40px; max-width: 800px; }
.hero-tag { background: var(--accent); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; margin-bottom: 12px; }
.hero-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; line-height: 1.3; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.hero-meta { display: flex; gap: 16px; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }
.hero-desc { font-size: 0.95rem; color: #e2e8f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 検索・フィルター */
.search-filter-wrapper { background: var(--bg-card); padding: 24px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 32px; }
.search-box-row { display: flex; gap: 12px; margin-bottom: 16px; }
.search-input { flex: 1; background: var(--bg-darker); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; color: #fff; font-size: 1rem; transition: border-color 0.2s; }
.search-input:focus { border-color: var(--accent); outline: none; }
.search-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 24px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.search-btn:hover { background: var(--accent-hover); }
.filter-row { display: flex; flex-wrap: wrap; gap: 12px; }
.filter-select { background: var(--bg-darker); color: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer; }

/* アニメーション行（横スクロール） */
.section-title { font-size: 1.5rem; font-weight: 700; margin: 32px 0 16px 0; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; display: inline-block; width: 4px; height: 24px; background: var(--accent); border-radius: 2px; }
.scroll-row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 16px; scroll-behavior: smooth; }
.scroll-row::-webkit-scrollbar { height: 8px; }
.scroll-row::-webkit-scrollbar-track { background: transparent; }
.scroll-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

/* カードデザイン */
.anime-card {
  flex: 0 0 220px; background: var(--bg-card); border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.3s, border-color 0.3s;
  position: relative; display: flex; flex-direction: column;
}
.anime-card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,0.2); }
.card-img-wrap { position: relative; width: 100%; padding-top: 142%; background: var(--bg-darker); overflow: hidden; }
.card-img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; transition: transform 0.5s; }
.anime-card:hover .card-img { transform: scale(1.05); }
.card-score-badge { position: absolute; top: 10px; left: 10px; background: rgba(11,15,25,0.85); backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; color: var(--star-color); display: flex; align-items: center; gap: 4px; }
.card-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.card-title { font-size: 0.95rem; font-weight: 600; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
.card-meta { font-size: 0.8rem; color: var(--text-muted); }

/* グリッド表示（検索結果用） */
.anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; }

/* ローダー */
.loader-wrap { display: none; justify-content: center; align-items: center; padding: 40px 0; }
.loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 修正4：配信先ボタンのブランドカラーCSS追加 */
.stream-links-block { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-color); }
.stream-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
  text-decoration: none; border: 1px solid rgba(255,255,255,0.15); background: transparent; transition: all 0.2s;
}
/* ABEMA */
.stream-link.abema { border-color: rgba(0,188,212,.4); color: #00bcd4; }
.stream-link.abema:hover { border-color: #00bcd4; background: rgba(0,188,212,.08); }
/* dアニメ */
.stream-link.danime { border-color: rgba(255,102,0,.4); color: #ff6600; }
.stream-link.danime:hover { border-color: #ff6600; background: rgba(255,102,0,.08); }
/* Amazon */
.stream-link.amazon { border-color: rgba(0,168,225,.4); color: #00a8e1; }
.stream-link.amazon:hover { border-color: #00a8e1; background: rgba(0,168,225,.08); }
/* その他デフォルト */
.stream-link.default { border-color: rgba(255,71,87,.4); color: var(--accent); }
.stream-link.default:hover { border-color: var(--accent); background: rgba(255,71,87,.08); }

/* PWA バナー */
#pwaBanner { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--accent); border-radius: 12px; padding: 16px; z-index: 1000; display: none; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 500px; margin: 0 auto; }
.pwa-text { font-size: 0.9rem; color: #fff; }
.pwa-btns { display: flex; gap: 10px; }
.pwa-btn { padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; font-weight: 600; }
.pwa-accept { background: var(--accent); color: #fff; }
.pwa-decline { background: rgba(255,255,255,0.1); color: var(--text-muted); }

/* トースト */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(255,71,87,0.95); color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 10000; pointer-events: none; opacity: 0; transition: transform 0.3s, opacity 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<header>

<main>
  <div id="panel-home" class="panel active">
    <div class="hero-slider" id="heroSlot">
      <div class="loader-wrap" style="display:flex;"><div class="loader"></div></div>
    </div>
    <div id="homeRows"></div>
  </div>

  <div id="panel-search" class="panel">
    <div class="search-filter-wrapper">
      <div class="search-box-row">
        <input type="text" id="keywordInput" class="search-input" placeholder="作品名、キーワードを入力...">
        <button class="search-btn" onclick="executeSearch()">検索</button>
      </div>
      <div class="filter-row">
        <select id="yearSelect" class="filter-select"><option value="">すべての年</option></select>
        <select id="seasonSelect" class="filter-select">
          <option value="">すべてのシーズン</option>
          <option value="winter">冬</option>

      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">現在のトレンドや高評価作品から、隠れた名作まで厳選して提案します。</p>
      <button class="search-btn" style="padding:12px 32px;" onclick="generateAiRecommend()">おすすめを生成する</button>

    <div class="loader-wrap" id="recommendLoader"><div class="loader"></div></div>

</main>

<div id="modalOv" onclick="closeModal()">
  <div class="modal-body" onclick="event.stopPropagation()">
    <button class="m-close-btn" onclick="closeModal()">&times;</button>
    <div class="video-container" id="mTrailerFrameSlot"></div>
    <div class="m-info-block">
      <div class="m-title" id="mTitle">作品タイトル</div>
      <div class="m-synopsis" id="mSynopsis">あらすじデータがここにロードされます。</div>
      <div class="stream-links-block" id="mStreamSlot"></div>
    </div>
  </div>
</div>

<div id="pwaBanner">
  <div class="pwa-text">ANIMEDBをホーム画面に追加して快適に楽しもう</div>
  <div class="pwa-btns">
    <button class="pwa-btn pwa-accept" onclick="triggerPwaInstall()">追加</button>
    <button class="pwa-btn pwa-decline" onclick="dismissPwaBanner()">また今度</button>
  </div>
</div>
<div id="toast"></div>

<script>
console.log("★★ANIMEDB 1.6 完全版 起動★★");

// 1. グローバル状態管理
const STATE = {
  cache: {},
  currentHeroIndex: 0,
  heroTimer: null,
  pwaDeferredPrompt: null
};

// 2. 定数定義
const API_BASE = "https://api.jikan.moe/v4";
const CURRENT_YEAR = 2026;

// 3. 初期化処理
document.addEventListener("DOMContentLoaded", () => {
  setupYearDropdown();
  loadHomeContent();
  initPwaDetection();
});

// 4. 年セレクトボックス生成
function setupYearDropdown() {
  const select = document.getElementById("yearSelect");
  if (!select) return;
  for (let y = CURRENT_YEAR; y >= 1990; y--) {
    const opt = document.createElement("option");
    opt.value = y; opt.textContent = `${y}年`;
    select.appendChild(opt);
  }
}

// 5. パネル切り替え
function switchPanel(panelId) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  
  const targetPanel = document.getElementById(`panel-${panelId}`);
  const targetNav = document.getElementById(`nav-${panelId}`);
  if (targetPanel) targetPanel.classList.add("active");
  if (targetNav) targetNav.classList.add("active");
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 6. ホームコンテンツの非同期ロード
async function loadHomeContent() {
  try {
    const nowData = await fetchWithCache(`${API_BASE}/seasons/now?limit=10`);
    if (nowData && nowData.data) {
      renderHeroSlider(nowData.data.slice(0, 5));
    }
    
    const rowsContainer = document.getElementById("homeRows");
    if (!rowsContainer) return;
    rowsContainer.innerHTML = "";
    
    // 今期トレンド
    if (nowData && nowData.data) {
      createScrollRow(rowsContainer, "今シーズンの注目アニメ", nowData.data);
    }
    
    // 2026年高評価
    const top2026 = await fetchWithCache(`${API_BASE}/anime?year=2026&order_by=score&sort=desc&limit=10`);
    if (top2026 && top2026.data) {
      createScrollRow(rowsContainer, "2026年 高評価ランキング", top2026.data);
    }
    
    // 歴代最高峰
    const topAll = await fetchWithCache(`${API_BASE}/top/anime?limit=10`);
    if (topAll && topAll.data) {
      createScrollRow(rowsContainer, "歴代最高評価の名作", topAll.data);
    }
  } catch (err) {
    console.error("Home load error:", err);
  }
}

// 7. ヒーロースライダーの描画
function renderHeroSlider(list) {
  const slot = document.getElementById("heroSlot");
  if (!slot) return;
  slot.innerHTML = "";
  clearInterval(STATE.heroTimer);
  
  list.forEach((anime, idx) => {
    const item = document.createElement("div");
    item.className = `hero-item ${idx === 0 ? 'active' : ''}`;
    
    const bgImg = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
    const title = anime.title_japanese || anime.title;
    const score = anime.score ? `★ ${anime.score.toFixed(2)}` : '評価なし';
    const sString = anime.season ? translateSeasonString(anime.season) : '';
    const metaStr = `${anime.year || 2026}年${sString} / ${score}`;
    const desc = anime.synopsis || "あらすじデータはありません。";
    
    item.innerHTML = `
      <div class="hero-bg" style="background-image: url('${bgImg}')"></div>
      <div class="hero-content">
        <div class="hero-tag">TRENDING</div>
        <h2 class="hero-title">${title}</h2>
        <div class="hero-meta"><span>${metaStr}</span></div>
        <p class="hero-desc">${desc}</p>
      </div>
    `;
    item.addEventListener("click", () => openModal(anime.mal_id));
    slot.appendChild(item);
  });
  
  STATE.currentHeroIndex = 0;
  if (list.length > 1) {
    STATE.heroTimer = setInterval(() => {
      const items = slot.querySelectorAll(".hero-item");
      if (!items.length) return;
      items[STATE.currentHeroIndex].classList.remove("active");
      STATE.currentHeroIndex = (STATE.currentHeroIndex + 1) % items.length;
      items[STATE.currentHeroIndex].classList.add("active");
    }, 5000);
  }
}

// 8. スクロール行の生成
function createScrollRow(container, heading, list) {
  const section = document.createElement("section");
  section.innerHTML = `<h3 class="section-title">${heading}</h3>`;
  const row = document.createElement("div");
  row.className = "scroll-row";
  
  list.forEach(anime => {
    row.appendChild(createAnimeCard(anime));
  });
  section.appendChild(row);
  container.appendChild(section);
}

// 9. カード型要素の生成（修正3：英語表記を日本語表記へ一括置換）
function createAnimeCard(anime) {
  const card = document.createElement("div");
  card.className = "anime-card";
  card.addEventListener("click", () => openModal(anime.mal_id));
  
  const imgUrl = anime.images?.jpg?.image_url || '';
  const score = anime.score ? anime.score.toFixed(2) : '--';
  const title = anime.title_japanese || anime.title;
  const sString = anime.season ? translateSeasonString(anime.season) : '';
  const metaStr = `${anime.year || ''} ${sString}`;
  
  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${imgUrl}" class="card-img" alt="${title}" loading="lazy">
      <div class="card-score-badge">★ ${score}</div>
    </div>
    <div class="card-info">
      <div class="card-title">${title}</div>
      <div class="card-meta">${metaStr}</div>
    </div>
  `;
  return card;
}

// 10. 検索処理
async function executeSearch() {
  const kw = document.getElementById("keywordInput").value.trim();
  const year = document.getElementById("yearSelect").value;
  const season = document.getElementById("seasonSelect").value;
  const sort = document.getElementById("sortSelect").value;
  
  const loader = document.getElementById("searchLoader");
  const resultSlot = document.getElementById("searchResult");
  
  if (!resultSlot) return;
  resultSlot.innerHTML = "";
  if (loader) loader.style.display = "flex";
  
  let url = `${API_BASE}/anime?limit=24`;
  if (kw) url += `&q=${encodeURIComponent(kw)}`;
  if (year) url += `&year=${year}`;
  if (season) url += `&season=${season}`;
  
  if (sort === "score") url += `&order_by=score&sort=desc`;
  else if (sort === "popularity") url += `&order_by=popularity&sort=asc`;
  
  try {
    const res = await fetchWithCache(url);
    if (loader) loader.style.display = "none";
    if (res && res.data && res.data.length > 0) {
      res.data.forEach(anime => {
        resultSlot.appendChild(createAnimeCard(anime));
      });
    } else {
      resultSlot.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 0;">該当するアニメが見つかりませんでした。</p>`;
    }
  } catch (err) {
    if (loader) loader.style.display = "none";
    showToastText("検索中にエラーが発生しました。");
  }
}

// 11. AIおすすめ生成機能
async function generateAiRecommend() {
  const loader = document.getElementById("recommendLoader");
  const resultSlot = document.getElementById("recommendResult");
  if (!resultSlot) return;
  
  resultSlot.innerHTML = "";
  if (loader) loader.style.display = "flex";
  
  const randPages = [1, 2, 3];
  const page = randPages[Math.floor(Math.random() * randPages.length)];
  
  try {
    const res = await fetchWithCache(`${API_BASE}/top/anime?page=${page}&limit=24`);
    if (loader) loader.style.display = "none";
    if (res && res.data) {
      const shuffled = [...res.data].sort(() => 0.5 - Math.random());
      shuffled.slice(0, 8).forEach(anime => {
        resultSlot.appendChild(createAnimeCard(anime));
      });
    }
  } catch (err) {
    if (loader) loader.style.display = "none";
    showToastText("おすすめの生成に失敗しました。");
  }
}

// 12. 詳細モーダルの展開（修正3：英語ラベルを日本語へ修正）
async function openModal(id) {
  const modalOv = document.getElementById("modalOv");
  const frameSlot = document.getElementById("mTrailerFrameSlot");
  const titleSlot = document.getElementById("mTitle");
  const synSlot = document.getElementById("mSynopsis");
  const streamSlot = document.getElementById("mStreamSlot");
  
  if (!modalOv) return;
  
  titleSlot.textContent = "読み込み中...";
  synSlot.textContent = "";
  frameSlot.innerHTML = "";
  streamSlot.innerHTML = "";
  
  modalOv.classList.add("open");
  document.body.style.overflow = "hidden";
  
  try {
    const detail = await fetchWithCache(`${API_BASE}/anime/${id}`);
    if (!detail || !detail.data) return;
    const anime = detail.data;
    
    titleSlot.textContent = anime.title_japanese || anime.title;
    
    // メタ情報ブロックの構築
    const score = anime.score ? anime.score.toFixed(2) : '--';
    const rank = anime.rank ? anime.rank : '--';
    const pop = anime.popularity ? anime.popularity : '--';
    const mem = anime.members ? anime.members.toLocaleString() : '--';
    
    let infoHtml = `
      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; background:rgba(0,0,0,0.2); padding:12px; border-radius:8px; margin-bottom:14px; font-size:0.85rem;">
        <div><span style="color:var(--star-color)">★</span> <strong>スコア:</strong> ${score}</div>
        <div>🏆 <strong>順位:</strong> ${rank}</div>
        <div>🔥 <strong>人気度:</strong> ${pop}</div>
        <div>👥 <strong>メンバー:</strong> ${mem}</div>
      </div>
    `;
    
    const synText = anime.synopsis_japanese || anime.synopsis || "あらすじ情報はありません。";
    synSlot.innerHTML = infoHtml + `<div style="line-height:1.5;">${synText}</div>`;
    
    // 予告動画表示
    if (anime.trailer?.youtube_id) {
      frameSlot.innerHTML = `<iframe src="https://www.youtube.com/embed/${anime.trailer.youtube_id}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      frameSlot.innerHTML = `<div style="padding:40px 0; text-align:center; color:var(--text-muted); font-size:0.9rem;">予告動画はありません</div>`;
    }
    
    // 配信ボタン群（自動リンク生成）
    appendStreamLinks(streamSlot, anime.title_japanese || anime.title);
    
  } catch (err) {
    titleSlot.textContent = "エラー";
    synSlot.textContent = "データの取得に失敗しました。";
  }
}

// 修正2：モーダルを確実に閉じるクリーンな関数
function closeModal() {
  const modalOv = document.getElementById('modalOv');
  if (modalOv) {
    modalOv.style.display = 'none';
    modalOv.classList.remove('open');
    document.body.style.overflow = '';
    const frameSlot = document.getElementById('mTrailerFrameSlot');
    if (frameSlot) frameSlot.innerHTML = '';
  }
}

// 13. 配信リンク自動付与機能（修正4：指定カラーをクラスで割り当て統一）
function appendStreamLinks(container, title) {
  if (!container || !title) return;
  const encoded = encodeURIComponent(title);
  
  const networks = [
    { name: "ABEMA", url: `https://abema.tv/search?q=${encoded}`, cls: "abema" },
    { name: "dアニメストア", url: `https://animestore.docomo.ne.jp/animestore/sch_pc?searchKey=${encoded}`, cls: "danime" },
    { name: "Amazonプライム", url: `https://www.amazon.co.jp/s?k=${encoded}&i=instant-video`, cls: "amazon" }
  ];
  
  networks.forEach(net => {
    const a = document.createElement("a");
    a.href = net.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = `stream-link ${net.cls}`;
    a.innerHTML = `▶ ${net.name}`;
    container.appendChild(a);
  });
}

// 14. ヘルパー関数
function translateSeasonString(seasonWord) {
  if (!seasonWord) return '';
  const s = seasonWord.toLowerCase();
  if (s.includes('winter') || s.includes('冬')) return '冬';
  if (s.includes('spring') || s.includes('春')) return '春';
  if (s.includes('summer') || s.includes('夏')) return '夏';
  if (s.includes('fall') || s.includes('autumn') || s.includes('秋')) return '秋';
  return seasonWord;
}

function showToastText(message) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

// 15. キャッシュ機能付きフェッチ
async function fetchWithCache(url) {
  const now = Date.now();
  if (STATE.cache[url] && (now - STATE.cache[url].timestamp < 10 * 60 * 1000)) {
    return STATE.cache[url].data;
  }
  
  await new Promise(res => setTimeout(res, 400)); // API負荷軽減
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
  const data = await response.json();
  
  STATE.cache[url] = { timestamp: now, data: data };
  return data;
}

// 16. PWA・インストール制御
function initPwaDetection() {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    STATE.pwaDeferredPrompt = e;
    const banner = document.getElementById('pwaBanner');
    const dismissed = localStorage.getItem('pwa_banner_dismissed');
    if (banner && !dismissed) {
      banner.style.display = 'flex';
    }
  });
}

function triggerPwaInstall() {
  const banner = document.getElementById('pwaBanner');
  if (banner) banner.style.display = 'none';
  
  const promptEvent = STATE.pwaDeferredPrompt;
  if (!promptEvent) return;
  promptEvent.prompt();
  promptEvent.userChoice.then(() => {
    STATE.pwaDeferredPrompt = null;
  });
}

function dismissPwaBanner() {
  const banner = document.getElementById('pwaBanner');
  if (banner) banner.style.display = 'none';
  localStorage.setItem('pwa_banner_dismissed', 'true');
}
