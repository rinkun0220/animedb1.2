<script>
const questions = [
  {
    text: "アニメを見て一番「うまい」と感じるのはどんな時？",
    options: [
      { label: "伏線が綺麗に回収された瞬間", scores: { script: 3, kousatsu: 2 } },
      { label: "作画・演出が特別すごかったカット", scores: { enshutsu: 3 } },
      { label: "キャラクターの表情や仕草に萌えた瞬間", scores: { chara: 3 } },
      { label: "何気ないシーンの空気感がよかった時", scores: { funiki: 3 } },
      { label: "テーマの裏にある意味に気づいた時", scores: { kousatsu: 3, script: 1 } }
    ]
  },
  {
    text: "友達にアニメを勧めるとき、まず何を話す？",
    options: [
      { label: "「脚本の構成が本当に上手い」", scores: { script: 3 } },
      { label: "「作画がとにかく綺麗」", scores: { enshutsu: 3 } },
      { label: "「キャラが最高に可愛い/かっこいい」", scores: { chara: 3 } },
      { label: "「見た後にいろいろ考えさせられる」", scores: { kousatsu: 3 } },
      { label: "「雰囲気が独特で癒される」", scores: { funiki: 3 } }
    ]
  },
  {
    text: "1話切りするとしたら、一番の決め手は？",
    options: [
      { label: "台詞や展開がテンプレすぎる", scores: { script: 3 } },
      { label: "作画・演出のクオリティが低い", scores: { enshutsu: 3 } },
      { label: "キャラクターに魅力を感じない", scores: { chara: 3 } },
      { label: "雰囲気や世界観が合わない", scores: { funiki: 3 } },
      { label: "テーマ性が浅く感じる", scores: { kousatsu: 3 } }
    ]
  },
  {
    text: "見終わった後、真っ先にすることは？",
    options: [
      { label: "脚本家・シリーズ構成をチェックする", scores: { script: 3 } },
      { label: "作画が良かったシーンを見返す", scores: { enshutsu: 3 } },
      { label: "推しキャラのグッズや二次創作を探す", scores: { chara: 3 } },
      { label: "考察サイトやSNSで感想を探す", scores: { kousatsu: 3 } },
      { label: "余韻に浸って何もしない", scores: { funiki: 3 } }
    ]
  },
  {
    text: "理想のアニメ視聴環境は？",
    options: [
      { label: "話の展開に集中できる静かな環境", scores: { script: 2, kousatsu: 2 } },
      { label: "大画面・良い音響でしっかり浸る", scores: { enshutsu: 3 } },
      { label: "推しの登場シーンで一時停止できる環境", scores: { chara: 3 } },
      { label: "リラックスして、ながら見できる環境", scores: { funiki: 3 } }
    ]
  }
];

const results = {
  script: {
    emoji: "✍️",
    name: "脚本派",
    desc: "あなたは脚本派です。話の構成、伏線の張り方、台詞の一つひとつに注目するタイプ。「なぜこの展開になったのか」を理解して初めて満足できる、物語の設計そのものを楽しむ視聴者です。",
    tip: "ANIMEDB管理人も脚本派を公言しています。<a href='/blog/rating-criteria.html' style='color:var(--star-color)'>評価基準の記事</a>で詳しく語っているので、共感できる部分が多いはずです。"
  },
  enshutsu: {
    emoji: "🎬",
    name: "演出派",
    desc: "あなたは演出派です。カット割り、色使い、動きの気持ちよさなど、画面そのものが持つ表現力に強く反応するタイプ。同じ脚本でも「魅せ方」で評価が大きく変わる、映像作品としてのアニメを見ている視聴者です。",
    tip: "演出のこだわりが強い制作会社が気になるなら、<a href='/studio-diagnosis.html' style='color:var(--star-color)'>制作会社診断</a>も試してみてください。"
  },
  chara: {
    emoji: "💖",
    name: "キャラ萌え派",
    desc: "あなたはキャラ萌え派です。ストーリーの巧拙よりも、キャラクターの魅力・関係性・声優の演技に強く惹かれるタイプ。「このキャラがいるから見続けられる」という原動力を大事にしている視聴者です。",
    tip: "好きなキャラを演じている声優を辿ってみるのもおすすめです。<a href='/directory.html' style='color:var(--star-color)'>声優・スタッフ名鑑</a>から探してみてください。"
  },
  kousatsu: {
    emoji: "🔍",
    name: "考察派",
    desc: "あなたは考察派です。表面的なストーリーよりも、その奥にあるテーマやメタファー、伏線の意図を読み解くことに喜びを感じるタイプ。見終わった後も頭の中で反芻し続ける視聴者です。",
    tip: "<a href='/blog/worst-anime-honest.html' style='color:var(--star-color)'>虚無枠問題を扱った記事</a>も、考察派の視点で読むと面白いはずです。"
  },
  funiki: {
    emoji: "🌙",
    name: "雰囲気派",
    desc: "あなたは雰囲気派です。ストーリーの起伏よりも、作品全体が持つ空気感・音楽・間の取り方に浸ることを大切にするタイプ。「なんとなく好き」という感覚を大事にできる視聴者です。",
    tip: "<a href='/hidden-gems-gacha.html' style='color:var(--star-color)'>埋もれた名作ガチャ</a>で、雰囲気重視の日常系作品に偶然出会ってみるのもおすすめです。"
  }
};

let currentQ = 0;
let scores = { script: 0, enshutsu: 0, chara: 0, kousatsu: 0, funiki: 0 };

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  currentQ = 0;
  scores = { script: 0, enshutsu: 0, chara: 0, kousatsu: 0, funiki: 0 };
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressBar').style.width = ((currentQ) / questions.length * 100) + '%';
  const optsHtml = q.options.map((opt, i) =>
    `<button class="q-opt" onclick="selectOption(${i})">${opt.label}</button>`
  ).join('');
  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options">${optsHtml}</div>
    </div>
  `;
}

function selectOption(i) {
  const opt = questions[currentQ].options[i];
  for (const key in opt.scores) {
    scores[key] += opt.scores[key];
  }
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const topKey = ranked[0];
  const secondKey = ranked[1];
  const r = results[topKey];
  const r2 = results[secondKey];
  const isMixed = scores[topKey] - scores[secondKey] <= 1;
  const shareText = encodeURIComponent(`私の視聴タイプは「${r.emoji} ${r.name}」でした！ #ANIMEDB視聴傾向診断`);
  const shareUrl = encodeURIComponent('https://anime-db.jp/viewer-type.html');

  document.getElementById('resultScreen').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${r.emoji}</div>
      <div class="result-label">あなたの視聴タイプは…</div>
      <div class="result-name">${r.name}</div>
      <div class="result-desc">${r.desc}</div>
      <div class="result-tip">${r.tip}</div>
      ${isMixed ? `<div class="mix-note">僅差で「${r2.emoji} ${r2.name}」の要素も強く出ています。2つのタイプを併せ持つバランス型かもしれません。</div>` : ''}
      <div class="result-btns" style="margin-top:20px;">
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="result-btn share">𝕏 結果をシェア</a>
        <button class="result-btn secondary" onclick="restartQuiz()">もう一度診断する</button>
      </div>
    </div>
  `;
  document.getElementById('resultScreen').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  startQuiz();
}
</script>
