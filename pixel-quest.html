<body>

  <a href="/" class="logo"><span class="logo-a">ANIME</span><span class="logo-db">DB</span></a>

    <a href="/" class="nav-item" style="text-decoration:none;">🏠 ホーム</a>
    <a href="/games.html" class="nav-item active" style="text-decoration:none;">🎮 診断・視聴傾向・ガチャ・シミュレーター</a>
  </div>
</header>

<main>
  <div class="page-head">
    <span class="page-tag">🥚 隠しゲーム発見</span>
    <h1 class="page-title">スタジオランナー</h1>
    <p class="page-desc">制作会社を擬人化したキャラクターで、障害物を飛び越えながらどこまでも走ろう。タップ／スペースキーでジャンプ。</p>
  </div>

  <div class="char-select active" id="charSelect">
    <div class="char-select-title">キャラクターを選んでスタート</div>
    <div class="char-grid" id="charGrid"></div>
    <div id="kojimaIntro" style="display:none;font-size:.8rem;color:var(--accent);font-style:italic;margin-bottom:14px;line-height:1.7;"></div>
    <button class="start-btn" onclick="startGame()">スタート →</button>
  </div>

  <div class="game-wrap" id="gameWrap">
    <div class="game-hud">
      <span class="hud-score" id="hudScore">SCORE: 0</span>
      <span class="hud-best" id="hudBest">BEST: 0</span>
    </div>
    <canvas id="gameCanvas" width="600" height="300"></canvas>
    <div class="game-hint">タップ / クリック / スペースキーでジャンプ</div>
  </div>

  <div class="gameover-box" id="gameoverBox">
    <div class="go-title">💥 ゲームオーバー</div>
    <div class="go-score">スコア：<strong id="finalScore">0</strong></div>
    <div id="kojimaOutro" style="display:none;font-size:.82rem;color:var(--accent);font-style:italic;margin-bottom:18px;line-height:1.8;padding:12px 16px;background:rgba(230,72,90,0.08);border-radius:10px;text-align:left;"></div>
    <div class="go-btns">
      <button class="go-btn primary" onclick="retryGame()">もう一度遊ぶ</button>
      <a href="/games.html" class="go-btn secondary">診断・ガチャ一覧へ</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-links">
    <a href="/" class="footer-link">ホーム</a>
    <a href="/blog/" class="footer-link">ブログ</a>
    <a href="/games.html" class="footer-link">診断・ガチャ一覧</a>
  </div>
  <p class="copyright">© 2026 ANIMEDB. All rights reserved.</p>
</footer>

<script>
const characters = [
  { name: "P.A.WORKS", color: "#e07a35", accent: "#fff" },
  { name: "京都アニメーション", color: "#5a9fd6", accent: "#fff" },
  { name: "CloverWorks", color: "#4ec9b0", accent: "#fff" },
  { name: "A-1 Pictures", color: "#e6485a", accent: "#fff" },
  { name: "wit studio", color: "#7a7a8c", accent: "#fff" },
  { name: "MAPPA", color: "#d99a3d", accent: "#111" },
  { name: "TRIGGER", color: "#c94ed6", accent: "#fff" },
  { name: "サイエンスSARU", color: "#5cc95c", accent: "#fff" },
  { name: "コジマプロダクション", color: "#1a1a1a", accent: "#e6485a", special: true, url: "https://www.kojimaproductions.jp/ja" }
];

let selectedChar = 0;
const charGrid = document.getElementById('charGrid');
characters.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'char-option' + (i === 0 ? ' selected' : '');
  const badge = c.special ? '<div style="font-size:.55rem;color:#e6485a;font-weight:800;margin-bottom:2px;">🎬 特別出演</div>' : '';
  el.innerHTML = `${badge}<div class="char-avatar" style="background:${c.color}${c.special ? ';border:2px solid #e6485a' : ''}"></div><div class="char-name">${c.name}</div>`;
  el.onclick = () => {
    document.querySelectorAll('.char-option').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    selectedChar = i;
    if (c.special) showKojimaIntro();
  };
  charGrid.appendChild(el);
});

const kojimaLines = [
  "……この先は、ゲームではない。人生だ。",
  "隠れるなら、ダンボールが一番だぞ。",
  "つながりは、見えないところにこそある……（Strand）",
  "コーデック、応答せよ……応答せよ……（ノイズ）",
  "監督のカメオ出演です。クレジットは後で。"
];
function showKojimaIntro() {
  const toast = document.getElementById('hudBest');
  // 一瞬だけ演出テキストを表示（ゲーム開始前の小さな小ネタ）
  const line = kojimaLines[Math.floor(Math.random() * kojimaLines.length)];
  const introEl = document.getElementById('kojimaIntro');
  if (introEl) {
    introEl.textContent = '🎬 ' + line;
    introEl.style.display = 'block';
    clearTimeout(window._kojimaIntroTimer);
    window._kojimaIntroTimer = setTimeout(() => { introEl.style.display = 'none'; }, 2600);
  }
}

const kojimaGameOverLines = [
  "あれ、ここ選びました？　実は管理人、小島秀夫信者です。",
  "「Kept you waiting, huh」……もう一回、待たせてしまったな。",
  "ダンボールに隠れていれば、この結果は避けられたかもしれない。",
  "STRAND……人と人、いや、キャラとプレイヤーのつながりがまた一つ生まれた。",
  "監督ならこう言うだろう。「これはゲームオーバーではない。始まりだ。」",
  "エンドロールが流れそうな余韻だが、まだ流れない。もう一回どうぞ。"
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GROUND_Y = 240;
let player, obstacles, score, best, speed, running, animId, spawnTimer;

function loadBest() {
  try { return parseInt(localStorage.getItem('animedb_runner_best') || '0'); } catch(e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('animedb_runner_best', v); } catch(e) {}
}
best = 0; // in-memory only fallback if storage unavailable
try { best = loadBest(); } catch(e) { best = 0; }
document.getElementById('hudBest').textContent = 'BEST: ' + best;

function resetGame() {
  const c = characters[selectedChar];
  player = { x: 60, y: GROUND_Y - 30, w: 30, h: 30, vy: 0, jumping: false, color: c.color, accent: c.accent };
  obstacles = [];
  score = 0;
  speed = 4.5;
  spawnTimer = 0;
  running = true;
}

function jump() {
  if (!running) return;
  if (!player.jumping) {
    player.vy = -11;
    player.jumping = true;
  }
}

function spawnObstacle() {
  const h = 24 + Math.random() * 20;
  obstacles.push({ x: canvas.width + 10, y: GROUND_Y - h, w: 18, h: h });
}

function update() {
  if (!running) return;

  // physics
  player.vy += 0.55;
  player.y += player.vy;
  if (player.y >= GROUND_Y - player.h) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  spawnTimer -= 1;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = 60 + Math.random() * 50 - Math.min(speed * 3, 40);
  }

  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  // collision
  for (const o of obstacles) {
    if (player.x < o.x + o.w && player.x + player.w > o.x &&
        player.y < o.y + o.h && player.y + player.h > o.y) {
      endGame();
      return;
    }
  }

  score += 1;
  speed += 0.0025;

  draw();
  animId = requestAnimationFrame(update);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ground
  ctx.fillStyle = '#252d45';
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  // obstacles
  ctx.fillStyle = '#e6485a';
  obstacles.forEach(o => {
    ctx.fillRect(o.x, o.y, o.w, o.h);
  });

  // player (simple chibi blob mascot)
  ctx.fillStyle = player.color;
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, player.w / 2, player.h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // eyes
  ctx.fillStyle = player.accent;
  ctx.beginPath();
  ctx.ellipse(cx - 6, cy - 3, 3, 4, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + 6, cy - 3, 3, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 2, 1.5, 0, Math.PI * 2);
  ctx.arc(cx + 6, cy - 2, 1.5, 0, Math.PI * 2);
  ctx.fill();

  document.getElementById('hudScore').textContent = 'SCORE: ' + Math.floor(score / 5);
}

function endGame() {
  running = false;
  cancelAnimationFrame(animId);
  const finalScore = Math.floor(score / 5);
  if (finalScore > best) {
    best = finalScore;
    saveBest(best);
  }
  document.getElementById('hudBest').textContent = 'BEST: ' + best;
  document.getElementById('finalScore').textContent = finalScore;

  const outroEl = document.getElementById('kojimaOutro');
  if (characters[selectedChar].special) {
    let line;
    if (finalScore >= 50) {
      line = "……見事だ。だが、これは『エンディング』ではない。次のミッションへの『プロローグ』だ。（THE END？ いや、まだだ）";
    } else {
      line = kojimaGameOverLines[Math.floor(Math.random() * kojimaGameOverLines.length)];
    }
    outroEl.innerHTML = '🎬 ' + line + '<br><a href="' + characters[selectedChar].url + '" target="_blank" rel="noopener" style="color:var(--star-color);font-size:.78rem;">→ KOJIMA PRODUCTIONS 公式サイト</a>';
    outroEl.style.display = 'block';
  } else {
    outroEl.style.display = 'none';
  }

  document.getElementById('gameWrap').classList.remove('active');
  document.getElementById('gameoverBox').classList.add('active');
}

function startGame() {
  document.getElementById('charSelect').classList.remove('active');
  document.getElementById('gameWrap').classList.add('active');
  document.getElementById('gameoverBox').classList.remove('active');
  resetGame();
  animId = requestAnimationFrame(update);
}

function retryGame() {
  document.getElementById('gameoverBox').classList.remove('active');
  document.getElementById('gameWrap').classList.add('active');
  resetGame();
  animId = requestAnimationFrame(update);
}

canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
</script>

</body>
