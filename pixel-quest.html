<script>
const characters = [
  { name: "P.A.WORKS", color: 0xe07a35, accent: 0xffffff },
  { name: "京都アニメーション", color: 0x5a9fd6, accent: 0xffffff },
  { name: "CloverWorks", color: 0x4ec9b0, accent: 0xffffff },
  { name: "A-1 Pictures", color: 0xe6485a, accent: 0xffffff },
  { name: "wit studio", color: 0x7a7a8c, accent: 0xffffff },
  { name: "MAPPA", color: 0xd99a3d, accent: 0x111111 },
  { name: "TRIGGER", color: 0xc94ed6, accent: 0xffffff },
  { name: "サイエンスSARU", color: 0x5cc95c, accent: 0xffffff },
  { name: "コジマプロダクション", color: 0x1a1a1a, accent: 0xe6485a, special: true, url: "https://www.kojimaproductions.jp/ja" }
];

let selectedChar = 0;
const charGrid = document.getElementById('charGrid');
characters.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'char-option' + (i === 0 ? ' selected' : '');
  const hex = '#' + c.color.toString(16).padStart(6, '0');
  const badge = c.special ? '<div style="font-size:.55rem;color:#e6485a;font-weight:800;margin-bottom:2px;">🎬 特別出演</div>' : '';
  const emoji = c.special ? '🕴️' : '✨';
  el.innerHTML = `${badge}<div class="char-avatar" style="background:${hex}${c.special ? ';border:2px solid #e6485a' : ''};display:flex;align-items:center;justify-content:center;font-size:18px;">${emoji}</div><div class="char-name">${c.name}</div>`;
  el.onclick = () => {
    document.querySelectorAll('.char-option').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    selectedChar = i;
    if (c.special) showKojimaIntro();
  };
  charGrid.appendChild(el);
});

const kojimaLines = [
  "……この先は、ゲームではない。人生だ。",
  "隠れるなら、ダンボールが一番だぞ。",
  "つながりは、見えないところにこそある……（Strand）",
  "コーデック、応答せよ……応答せよ……（ノイズ）",
  "監督のカメオ出演です。クレジットは後で。",
  "⚠️ 忠告しておく。これは『隠しキャラ』だ。難易度は、他の追随を許さない。",
  "ハシゴ……登るなら、心してかかれ。（例のアレ）",
  "このゲーム、実質ムービーパートが8割です（ウソです）",
  "赤ちゃん（BB）は落とさないように。……あ、いや、これはただのアクションゲームだった。",
  "Metal Gear? いいえ、Metal Jump です。"
];
function showKojimaIntro() {
  const line = kojimaLines[Math.floor(Math.random() * kojimaLines.length)];
  const introEl = document.getElementById('kojimaIntro');
  if (introEl) {
    introEl.innerHTML = '🎬 ' + line + '<br><span style="color:#d99a3d;font-weight:800;">⚠️ このキャラだけ難易度が上昇します</span>';
    introEl.style.display = 'block';
    clearTimeout(window._kojimaIntroTimer);
    window._kojimaIntroTimer = setTimeout(() => { introEl.style.display = 'none'; }, 3200);
  }
}

const kojimaGameOverLines = [
  "あれ、ここ選びました？　実は管理人、小島秀夫信者です。",
  "「Kept you waiting, huh」……もう一回、待たせてしまったな。",
  "ダンボールに隠れていれば、この結果は避けられたかもしれない。",
  "STRAND……人と人、いや、キャラとプレイヤーのつながりがまた一つ生まれた。",
  "監督ならこう言うだろう。「これはゲームオーバーではない。始まりだ。」",
  "エンドロールが流れそうな余韻だが、まだ流れない。もう一回どうぞ。",
  "本編は実は6時間くらいカットシーンが続く予定でした（大嘘）。",
  "ハシゴ、登り方を間違えましたね。次は気をつけて。",
  "「戦争、それは……」いや、これはただのジャンプゲームでした。",
  "プレビュー版よりさらに難しくしておきました。文句は監督へ（管理人へ）。"
];

/* ===================== 3D エンジン（Three.js） ===================== */
let scene, camera, renderer, playerGroup, groundMesh, lineMeshes = [];
let obstacles = [], score, best, speed, running, animId, spawnTimer;
let playerY = 0, playerVY = 0, jumping = false;
const LANE_Z = 0;

function loadBest() {
  try { return parseInt(localStorage.getItem('animedb_runner_best') || '0'); } catch(e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('animedb_runner_best', v); } catch(e) {}
}
best = 0;
try { best = loadBest(); } catch(e) { best = 0; }
document.getElementById('hudBest').textContent = 'BEST: ' + best;

function initScene() {
  const container = document.getElementById('gameCanvasWrap');
  const w = container.clientWidth, h = container.clientHeight;

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070d, 0.045);

  camera = new THREE.PerspectiveCamera(62, w / h, 0.1, 200);
  camera.position.set(0, 3.2, 6.5);
  camera.lookAt(0, 1, -10);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.setClearColor(0x05070d, 1);
  container.innerHTML = '<span class="render-badge">3D RENDER</span>';
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8899cc, 0.55));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(3, 8, 4);
  scene.add(dirLight);
  const accentLight = new THREE.PointLight(0xe6485a, 1.2, 25);
  accentLight.position.set(0, 3, 2);
  scene.add(accentLight);

  const groundGeo = new THREE.PlaneGeometry(6, 400, 1, 40);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a2138, roughness: 0.85, metalness: 0.1 });
  groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.position.z = -180;
  scene.add(groundMesh);

  const lineMat = new THREE.MeshBasicMaterial({ color: 0xe6485a });
  for (const xPos of [-2.6, 2.6]) {
    const lineGeo = new THREE.BoxGeometry(0.08, 0.05, 400);
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.set(xPos, 0.03, -180);
    scene.add(line);
  }

  for (let i = 0; i < 20; i++) {
    const dashGeo = new THREE.BoxGeometry(0.15, 0.04, 1.2);
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
    const dash = new THREE.Mesh(dashGeo, dashMat);
    dash.position.set(0, 0.02, -i * 4);
    scene.add(dash);
    lineMeshes.push(dash);
  }
}

function buildPlayer(charDef) {
  const group = new THREE.Group();
  const isOssan = !!charDef.special;
  const bodyColor = charDef.color;
  const accentColor = charDef.accent;

  if (isOssan) {
    const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd9a066, roughness: 0.6 });
    const head = new THREE.Mesh(bodyGeo, bodyMat);
    head.position.y = 0.9;
    group.add(head);

    const suitGeo = new THREE.ConeGeometry(0.55, 1.1, 8);
    const suitMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.7 });
    const suit = new THREE.Mesh(suitGeo, suitMat);
    suit.position.y = 0.15;
    group.add(suit);

    const glassGeo = new THREE.BoxGeometry(0.55, 0.15, 0.1);
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.6 });
    const glasses = new THREE.Mesh(glassGeo, glassMat);
    glasses.position.set(0, 0.95, 0.42);
    group.add(glasses);

    const tieGeo = new THREE.ConeGeometry(0.08, 0.5, 6);
    const tieMat = new THREE.MeshStandardMaterial({ color: accentColor });
    const tie = new THREE.Mesh(tieGeo, tieMat);
    tie.position.set(0, 0.4, 0.5);
    tie.rotation.x = Math.PI;
    group.add(tie);
  } else {
    const bodyGeo = new THREE.SphereGeometry(0.55, 20, 20);
    const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.4, metalness: 0.1, emissive: bodyColor, emissiveIntensity: 0.15 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.75;
    group.add(body);

    const capeGeo = new THREE.ConeGeometry(0.75, 1.0, 6, 1, true);
    const capeMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.6, side: THREE.DoubleSide });
    const cape = new THREE.Mesh(capeGeo, capeMat);
    cape.position.y = 0.15;
    group.add(cape);

    const ribbonMat = new THREE.MeshStandardMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.3 });
    const ribbonGeo = new THREE.ConeGeometry(0.18, 0.3, 4);
    const ribbonL = new THREE.Mesh(ribbonGeo, ribbonMat);
    ribbonL.position.set(-0.2, 1.25, 0);
    ribbonL.rotation.z = 0.6;
    group.add(ribbonL);
    const ribbonR = new THREE.Mesh(ribbonGeo, ribbonMat);
    ribbonR.position.set(0.2, 1.25, 0);
    ribbonR.rotation.z = -0.6;
    group.add(ribbonR);

    const stickGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.9, 6);
    const stickMat = new THREE.MeshStandardMaterial({ color: accentColor });
    const stick = new THREE.Mesh(stickGeo, stickMat);
    stick.position.set(0.6, 0.8, 0);
    stick.rotation.z = 0.4;
    group.add(stick);
    const starGeo = new THREE.OctahedronGeometry(0.13, 0);
    const starMat = new THREE.MeshStandardMaterial({ color: 0xfff8dc, emissive: 0xfff8dc, emissiveIntensity: 0.6 });
    const star = new THREE.Mesh(starGeo, starMat);
    star.position.set(0.85, 1.2, 0);
    group.add(star);
  }

  group.position.set(0, 0, LANE_Z);
  return group;
}

function resetGame() {
  const c = characters[selectedChar];
  const isKojima = !!c.special;

  if (playerGroup) scene.remove(playerGroup);
  playerGroup = buildPlayer(c);
  scene.add(playerGroup);

  obstacles.forEach(o => scene.remove(o.mesh));
  obstacles = [];
  score = 0;
  speed = isKojima ? 0.155 : 0.145;
  spawnTimer = 0;
  playerY = 0;
  playerVY = 0;
  jumping = false;
  running = true;
  window._hardMode = isKojima;
}

function jump() {
  if (!running) return;
  if (!jumping) {
    playerVY = 0.28;
    jumping = true;
  }
}

function spawnObstacle() {
  const hard = window._hardMode;
  const h = hard ? (0.7 + Math.random() * 0.9) : (0.55 + Math.random() * 0.6);
  const geo = new THREE.BoxGeometry(1.1, h, 0.5);
  const mat = new THREE.MeshStandardMaterial({ color: 0xe6485a, emissive: 0xe6485a, emissiveIntensity: 0.25, roughness: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, h / 2, -60);
  scene.add(mesh);
  obstacles.push({ mesh, h, z: -60 });

  const doubleChance = hard ? 0.35 : 0.22;
  if (speed > 0.19 && Math.random() < doubleChance) {
    const gap = hard ? (6 + Math.random() * 2.5) : (8 + Math.random() * 3);
    const h2 = hard ? (0.6 + Math.random() * 0.8) : (0.5 + Math.random() * 0.6);
    const geo2 = new THREE.BoxGeometry(1.1, h2, 0.5);
    const mesh2 = new THREE.Mesh(geo2, mat.clone());
    const z2 = -60 - gap;
    mesh2.position.set(0, h2 / 2, z2);
    scene.add(mesh2);
    obstacles.push({ mesh: mesh2, h: h2, z: z2 });
  }
}

function update() {
  if (!running) return;
  const hard = window._hardMode;

  playerVY -= 0.017;
  playerY += playerVY;
  if (playerY <= 0) {
    playerY = 0;
    playerVY = 0;
    jumping = false;
  }
  playerGroup.position.y = playerY;
  playerGroup.rotation.y = Math.sin(score * 0.05) * 0.08;

  lineMeshes.forEach(m => {
    m.position.z += speed * 1.6;
    if (m.position.z > 6) m.position.z -= 80;
  });

  spawnTimer -= 1;
  if (spawnTimer <= 0) {
    spawnObstacle();
    const baseMin = hard ? 22 : 28;
    const baseRand = hard ? 20 : 24;
    spawnTimer = baseMin + Math.random() * baseRand - Math.min(speed * 60, hard ? 16 : 18);
  }

  for (const o of obstacles) {
    o.z += speed * 1.6;
    o.mesh.position.z = o.z;
  }
  obstacles = obstacles.filter(o => {
    if (o.z > 8) { scene.remove(o.mesh); return false; }
    return true;
  });

  for (const o of obstacles) {
    if (Math.abs(o.z - LANE_Z) < 0.9 && playerY < o.h - 0.15) {
      endGame();
      return;
    }
  }

  score += 1;
  speed += hard ? 0.00016 : 0.00012;

  camera.position.y = 3.2 + Math.sin(score * 0.03) * 0.03;
  document.getElementById('hudScore').textContent = 'SCORE: ' + Math.floor(score / 5);

  renderer.render(scene, camera);
  animId = requestAnimationFrame(update);
}

function endGame() {
  running = false;
  cancelAnimationFrame(animId);
  const finalScore = Math.floor(score / 5);
  if (finalScore > best) {
    best = finalScore;
    saveBest(best);
  }
  document.getElementById('hudBest').textContent = 'BEST: ' + best;
  document.getElementById('finalScore').textContent = finalScore;

  const outroEl = document.getElementById('kojimaOutro');
  if (characters[selectedChar].special) {
    let line;
    if (finalScore >= 50) {
      line = "……見事だ。だが、これは『エンディング』ではない。次のミッションへの『プロローグ』だ。（THE END？ いや、まだだ）";
    } else {
      line = kojimaGameOverLines[Math.floor(Math.random() * kojimaGameOverLines.length)];
    }
    outroEl.innerHTML = '🎬 ' + line + '<br><a href="' + characters[selectedChar].url + '" target="_blank" rel="noopener" style="color:var(--star-color);font-size:.78rem;">→ KOJIMA PRODUCTIONS 公式サイト</a>';
    outroEl.style.display = 'block';
  } else {
    outroEl.style.display = 'none';
  }

  document.getElementById('gameWrap').classList.remove('active');
  document.getElementById('gameoverBox').classList.add('active');
}

function startGame() {
  document.getElementById('charSelect').classList.remove('active');
  document.getElementById('gameWrap').classList.add('active');
  document.getElementById('gameoverBox').classList.remove('active');
  if (!renderer) initScene();
  resetGame();
  animId = requestAnimationFrame(update);
}

function retryGame() {
  document.getElementById('gameoverBox').classList.remove('active');
  document.getElementById('gameWrap').classList.add('active');
  resetGame();
  animId = requestAnimationFrame(update);
}

function handleResize() {
  if (!renderer) return;
  const container = document.getElementById('gameCanvasWrap');
  const w = container.clientWidth, h = container.clientHeight;
  if (w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

document.getElementById('gameCanvasWrap').addEventListener('mousedown', jump);
document.getElementById('gameCanvasWrap').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
</script>

</body>
