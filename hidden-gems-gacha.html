<script>
const pool = [

  { title: "ギルドの受付嬢ですが、残業は嫌なのでボスをソロ討伐しようと思います", genre: "2025年 / ファンタジー・コメディ", badges: ["abema","danime","amazon","netflix"], link: "/blog/hidden-gems-2025-all.html#gem2" },

  { title: "Turkey!", genre: "2025年 / 青春・スポーツ・コメディ", badges: ["abema","danime"], link: "/blog/hidden-gems-2025-all.html#gem4" },
  { title: "九龍ジェネリックロマンス", genre: "2025年 / ロマンス・SF・謎", badges: ["abema","danime","amazon","netflix"], link: "/blog/hidden-gems-2025-all.html#gem5" },
  { title: "黒岩メダカに私の可愛いが通じない", genre: "2025年 / ラブコメ・青春", badges: ["abema","danime","amazon"], link: "/blog/hidden-gems-2025-all.html#gem6" },
  { title: "最後にひとつだけお願いしてもよろしいでしょうか", genre: "2025年 / ロマンス・ファンタジー・感動", badges: ["abema","danime","amazon"], link: "/blog/hidden-gems-2025-all.html#gem7" },
  { title: "友達の妹が俺にだけウザい", genre: "2025年 / ラブコメ・青春", badges: ["abema","danime","amazon"], link: "/blog/hidden-gems-2025-all.html#gem8" },
  { title: "永久のユウグレ", genre: "2025年 / SF・感動・ドラマ", badges: ["abema","danime","amazon"], link: "/blog/hidden-gems-2025-all.html#gem9" },
  { title: "忍者と殺し屋のふたりぐらし", genre: "2025年 / アクション・ラブコメ", badges: ["abema","danime"], link: "/blog/hidden-gems-2025-all.html#gem10" },
  { title: "履いてください、鷹峰さん", genre: "2025年 / ラブコメ・日常", badges: ["abema","danime"], link: "/blog/hidden-gems-2025-all.html#gem11" },
  { title: "ばっどがーる", genre: "2025年 / 青春・ドラマ", badges: ["abema","danime"], link: "/blog/hidden-gems-2025-all.html#gem12" },
  { title: "花は咲く、修羅の如く", genre: "2025年 / 青春・落語・ドラマ", badges: ["abema","danime","amazon"], link: "/blog/hidden-gems-2025-all.html#gem13" },
  { title: "日々は過ぎれど飯うまし", genre: "2025年 / 日常・グルメ・癒し", badges: ["abema","danime"], link: "/blog/hidden-gems-2025-all.html#gem14" },
  { title: "フードコートでまた明日。", genre: "2025年 / 日常・青春・ほっこり", badges: ["abema","danime"], link: "/blog/hidden-gems-2025-all.html#gem15" },

  { title: "時々ボソッとロシア語でデレる隣のアーリャさん", genre: "2024年夏 / ラブコメ", badges: ["abema","danime","amazon","netflix"], link: "/blog/hidden-gems-2023-2024.html" },
  { title: "シャングリラ・フロンティア", genre: "2023年〜2024年 / ゲーム・バトル", badges: ["abema","danime","amazon"], link: "/blog/hidden-gems-2023-2024.html" },
  { title: "呪術廻戦 懐玉・玉折", genre: "2023年 / バトル・前日譚", badges: ["abema","danime","amazon","netflix"], link: "/blog/hidden-gems-2023-2024.html" },
  { title: "夜のクラゲは泳げない", genre: "2024年春 / 青春・音楽", badges: ["abema","danime"], link: "/blog/hidden-gems-2023-2024.html" }
];
const badgeLabels = { abema: "ABEMA", danime: "dアニメ", amazon: "Amazon", netflix: "Netflix" };
let lastIndex = -1;
let spinning = false;

function pullGacha() {
  if (spinning) return;
  spinning = true;
  const btn = document.getElementById('gachaBtn');
  const orb = document.getElementById('gachaOrb');
  const resultCard = document.getElementById('resultCard');
  btn.disabled = true;
  resultCard.style.display = 'none';
  orb.classList.add('spinning');

  const orbEmojis = ['🎲','🎰','✨','💫','🎲'];
  let tick = 0;
  const spinInterval = setInterval(() => {
    orb.textContent = orbEmojis[tick % orbEmojis.length];
    tick++;
  }, 100);

  setTimeout(() => {
    clearInterval(spinInterval);
    orb.classList.remove('spinning');
    orb.textContent = '🎁';

    let idx;
    do { idx = Math.floor(Math.random() * pool.length); } while (idx === lastIndex && pool.length > 1);
    lastIndex = idx;
    const item = pool[idx];

    const badgesHtml = item.badges.map(b => `<span class="stream-badge ${b}">${badgeLabels[b]}</span>`).join('');
    const shareText = encodeURIComponent(`ガチャで「${item.title}」が出ました！ #ANIMEDB埋もれた名作ガチャ`);
    const shareUrl = encodeURIComponent('https://anime-db.jp/hidden-gems-gacha.html');
    resultCard.innerHTML = `
      <div class="result-badge">🎉 今日のあなたに提案する1本</div>
      <div class="result-title">${item.title}</div>
      <div class="result-genre">${item.genre}</div>
      <div class="result-badges">${badgesHtml}</div>
      <div class="result-btns">
        <a href="${item.link}" class="result-link">詳しく見る →</a>
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="share-btn">𝕏 結果をシェア</a>
        <button class="again-btn" onclick="pullGacha()">もう一回引く</button>
      </div>
    `;
    resultCard.style.display = 'block';
    btn.disabled = false;
    spinning = false;
  }, 900);
}
</script>
