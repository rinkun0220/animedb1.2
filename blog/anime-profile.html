.q-num { font-size: 0.78rem; color: var(--accent); font-weight: 700; margin-bottom: 10px; }

.q-opt:hover { border-color: var(--accent); background: rgba(230,72,90,0.06); }

.card-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
#profileCanvas { width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }

.result-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    <p class="page-desc">6つの質問から、あなたの"アニメ視聴者としてのプロフィールカード"を作成します。画像として保存・シェアできます。</p>

      <button class="result-btn share" onclick="shareCard()">𝕏 結果をシェア</button>

</footer>

<script>
const questions = [
  {
    text: "いつからアニメを見始めましたか？",
    options: [
      { label: "物心つく前からずっと", stats: { keiken: 4 } },
      { label: "学生時代から", stats: { keiken: 3 } },
      { label: "社会人になってから", stats: { keiken: 2 } },
      { label: "ここ数年で最近ハマった", stats: { keiken: 1 } }
    ]
  },
  {
    text: "1クールに何本くらい見ますか？",
    options: [
      { label: "1〜2本、じっくり派", stats: { haba: 1 } },
      { label: "3〜5本くらい", stats: { haba: 2 } },
      { label: "6〜10本、幅広く", stats: { haba: 3 } },
      { label: "10本以上、可能な限り追う", stats: { haba: 4 } }
    ]
  },
  {
    text: "一番泣いた・心を動かされたジャンルは？",
    options: [
      { label: "感動系のヒューマンドラマ", stats: { ruisen: 4 } },
      { label: "青春もの", stats: { ruisen: 3 } },
      { label: "バトルものの友情シーン", stats: { ruisen: 3 } },
      { label: "あまり泣かない・熱くならないタイプ", stats: { ruisen: 1 } }
    ]
  },
  {
    text: "アニメを見るときのこだわりは？",
    options: [
      { label: "脚本・構成の巧さ", stats: { kodawari: 4, type: "脚本派" } },
      { label: "作画・演出のクオリティ", stats: { kodawari: 4, type: "演出派" } },
      { label: "キャラクター・声優の魅力", stats: { kodawari: 4, type: "キャラ萌え派" } },
      { label: "特にこだわらず気楽に楽しむ", stats: { kodawari: 1, type: "自由派" } }
    ]
  },
  {
    text: "一番長く追っているシリーズ、何年目ですか？",
    options: [
      { label: "10年以上", stats: { keizoku: 4 } },
      { label: "5〜9年", stats: { keizoku: 3 } },
      { label: "1〜4年", stats: { keizoku: 2 } },
      { label: "まだ日が浅い", stats: { keizoku: 1 } }
    ]
  },
  {
    text: "主にどんな時間帯にアニメを見ますか？",
    options: [
      { label: "深夜0時〜2時、リアルタイム勢", stats: { haba: 1, type2: "深夜アニメ探求者" } },
      { label: "通勤・通学のスキマ時間", stats: { type2: "スキマ視聴の達人" } },
      { label: "週末にまとめて一気見", stats: { type2: "週末一気見タイプ" } },
      { label: "配信された分をこまめに", stats: { type2: "コツコツ追走型" } }
    ]
  }
];

let currentQ = 0;
let stats = { keiken: 0, haba: 0, ruisen: 0, kodawari: 0, keizoku: 0 };
let chosenType = "自由派";
let chosenType2 = "コツコツ追走型";

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  currentQ = 0;
  stats = { keiken: 0, haba: 0, ruisen: 0, kodawari: 0, keizoku: 0 };
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressBar').style.width = (currentQ / questions.length * 100) + '%';
  const optsHtml = q.options.map((opt, i) =>
    `<button class="q-opt" onclick="selectOption(${i})">${opt.label}</button>`
  ).join('');
  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options">${optsHtml}</div>
    </div>
  `;
}

function selectOption(i) {
  const opt = questions[currentQ].options[i];
  for (const key in opt.stats) {
    if (key === 'type') chosenType = opt.stats[key];
    else if (key === 'type2') chosenType2 = opt.stats[key];
    else stats[key] = (stats[key] || 0) + opt.stats[key];
  }
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  drawCard();
}

function drawCard() {
  const canvas = document.getElementById('profileCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // 背景グラデーション
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#161f30');
  grad.addColorStop(1, '#0b0f19');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 外枠
  ctx.strokeStyle = '#e6485a';
  ctx.lineWidth = 4;
  ctx.strokeRect(16, 16, W - 32, H - 32);
  ctx.strokeStyle = 'rgba(230,72,90,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(26, 26, W - 52, H - 52);

  // ヘッダー
  ctx.fillStyle = '#e6485a';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎬 ANIME PROFILE CARD', W / 2, 68);

  ctx.fillStyle = '#a4b0be';
  ctx.font = '13px sans-serif';
  ctx.fillText('issued by ANIMEDB', W / 2, 90);

  // タイプ名
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 34px sans-serif';
  ctx.fillText(chosenType, W / 2, 150);
  ctx.fillStyle = '#d99a3d';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('× ' + chosenType2, W / 2, 182);

  // ステータスバー
  const statList = [
    { label: '経験値', key: 'keiken', max: 4 },
    { label: '視聴の幅', key: 'haba', max: 4 },
    { label: '涙腺力', key: 'ruisen', max: 4 },
    { label: 'こだわり度', key: 'kodawari', max: 4 },
    { label: '継続力', key: 'keizoku', max: 4 }
  ];

  let barY = 230;
  const barX = 70;
  const barW = W - 140;
  const barH = 22;

  statList.forEach((s) => {
    ctx.fillStyle = '#f1f2f6';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(s.label, barX, barY - 8);

    // バー背景
    ctx.fillStyle = '#0b0f19';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeRect(barX, barY, barW, barH);

    // バー本体
    const ratio = Math.min(stats[s.key] / s.max, 1);
    const fillGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    fillGrad.addColorStop(0, '#e6485a');
    fillGrad.addColorStop(1, '#d99a3d');
    ctx.fillStyle = fillGrad;
    ctx.fillRect(barX, barY, barW * ratio, barH);

    // 数値
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(stats[s.key] + ' / ' + s.max, barX + barW, barY - 8);

    barY += 58;
  });

  // 総合スコア
  const total = stats.keiken + stats.haba + stats.ruisen + stats.kodawari + stats.keizoku;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a4b0be';
  ctx.font = '14px sans-serif';
  ctx.fillText('総合アニメ偏差値', W / 2, barY + 30);
  ctx.fillStyle = '#e6485a';
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText(total + ' / 20', W / 2, barY + 82);

  // フッター
  ctx.fillStyle = '#a4b0be';
  ctx.font = '13px sans-serif';
  ctx.fillText('anime-db.jp/anime-profile.html', W / 2, H - 40);
}

function downloadCard() {
  const canvas = document.getElementById('profileCanvas');
  const link = document.createElement('a');
  link.download = 'anime-profile-card.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function shareCard() {
  const total = stats.keiken + stats.haba + stats.ruisen + stats.kodawari + stats.keizoku;
  const shareText = encodeURIComponent(`私のアニメタイプは「${chosenType} × ${chosenType2}」総合偏差値${total}/20でした！ #ANIMEDBアニメ履歴書`);
  const shareUrl = encodeURIComponent('https://anime-db.jp/anime-profile.html');
  window.open(`https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`, '_blank', 'noopener');
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  startQuiz();
}
</script>
