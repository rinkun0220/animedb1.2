    <span class="page-tag">🎬 診断コンテンツ</span>
    <h1 class="page-title">あなたに合う監督診断</h1>
    <p class="page-desc">5つの質問に答えるだけで、あなたの好みに一番近いアニメ監督がわかります。所要時間は約1分です。</p>
  </div>

  <div id="startScreen">
    <div class="q-card">
      <p style="font-size:0.95rem; color:var(--text-muted); margin-bottom:24px; line-height:1.9;">感情を爆発させる演出、日常芝居の緻密さ、音楽と美術の調和、ジャンルを超えた振れ幅。監督ごとの"画面の作り方"は驚くほど違います。あなたの"好き"はどの監督に近いでしょうか？</p>
      <button class="start-btn" onclick="startQuiz()">診断をはじめる →</button>
    </div>
  </div>

<script>
const questions = [
  {
    text: "好きな演出は？",
    options: [
      { label: "感情が爆発するシーンの強い演出", scores: { nagai: 3 } },
      { label: "日常芝居の緻密さ、笑いとシリアスのバランス", scores: { ishihara: 3 } },
      { label: "音楽・美術を活かした繊細な画作り", scores: { ishidate: 3 } },
      { label: "ジャンルを問わないテンポの良さ", scores: { mizushima: 3 } }
    ]
  },
  {
    text: "好きなジャンルは？",
    options: [
      { label: "青春の痛みを描く作品", scores: { nagai: 3 } },
      { label: "日常系・京都アニメーション系の作品", scores: { ishihara: 3 } },
      { label: "音楽もの・映像美が際立つ作品", scores: { ishidate: 3 } },
      { label: "コメディからミリタリー、業界ものまで幅広く", scores: { mizushima: 3 } }
    ]
  },
  {
    text: "一番刺さる瞬間は？",
    options: [
      { label: "感情が爆発する瞬間の演出", scores: { nagai: 3 } },
      { label: "笑いとシリアスの絶妙なバランス", scores: { ishihara: 3 } },
      { label: "繊細な感情表現の積み重ね", scores: { ishidate: 3 } },
      { label: "テンポよく物語が転がっていく瞬間", scores: { mizushima: 3 } }
    ]
  },
  {
    text: "監督に求めるものは？",
    options: [
      { label: "脚本と一体化した感情の演出力", scores: { nagai: 3 } },
      { label: "緻密な日常芝居の積み上げ", scores: { ishihara: 3 } },
      { label: "音楽・美術との調和", scores: { ishidate: 3 } },
      { label: "ジャンルを超えた振れ幅の広さ", scores: { mizushima: 3 } }
    ]
  },
  {
    text: "好きな画作りは？",
    options: [
      { label: "感情を爆発させる強いカット割り", scores: { nagai: 3 } },
      { label: "笑いとシリアスの緩急がついた画面", scores: { ishihara: 3 } },
      { label: "音楽・美術が引き立つ美しい画面", scores: { ishidate: 3 } },
      { label: "テンポよく展開する軽快な画面", scores: { mizushima: 3 } }
    ]
  }
];

const results = {
  nagai: {
    name: "長井龍雪",
    desc: "あなたに一番近いのは長井龍雪です。脚本の岡田麿里とのタッグ作品を中心に、青春の痛みを真正面から描く監督。感情の爆発シーンの演出に強く惹かれるタイプです。",
    works: "代表作：あの日見た花の名前を僕達はまだ知らない。　など",
    anchor: "nagai"
  },
  ishihara: {
    name: "石原立也",
    desc: "あなたに一番近いのは石原立也です。京都アニメーションの土台を作った世代の監督。日常芝居の緻密さと、笑いとシリアスのバランス感覚に長けている作風に惹かれるタイプです。",
    works: "代表作：涼宮ハルヒの憂鬱　など",
    anchor: "ishihara"
  },
  ishidate: {
    name: "石立太一",
    desc: "あなたに一番近いのは石立太一です。京都アニメーションの次世代を担う監督。繊細な感情表現と、音楽・美術を活かした画作りの美しさに強く惹かれるタイプです。",
    works: "代表作：ヴァイオレット・エヴァーガーデン　など",
    anchor: "ishidate"
  },
  mizushima: {
    name: "水島努",
    desc: "あなたに一番近いのは水島努です。ジャンルを問わない振れ幅の広さが持ち味。コメディからミリタリー、業界ものまで幅広く手掛け、どの作品もテンポの良さが光る作風に惹かれるタイプです。",
    works: "代表作：SHIROBAKO　など",
    anchor: "mizushima",
    official: "https://x.com/tsuki_akari"
  }
};

let currentQ = 0;
let scores = { nagai: 0, ishihara: 0, ishidate: 0, mizushima: 0 };

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  currentQ = 0;
  scores = { nagai: 0, ishihara: 0, ishidate: 0, mizushima: 0 };
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressBar').style.width = ((currentQ) / questions.length * 100) + '%';
  const optsHtml = q.options.map((opt, i) =>
    `<button class="q-opt" onclick="selectOption(${i})">${opt.label}</button>`
  ).join('');
  document.getElementById('quizScreen').innerHTML = `
    <div class="q-card">
      <div class="q-num">Q${currentQ + 1} / ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="q-options">${optsHtml}</div>
    </div>
  `;
}

function selectOption(i) {
  const opt = questions[currentQ].options[i];
  for (const key in opt.scores) {
    scores[key] += opt.scores[key];
  }
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').classList.add('hidden');
  const ranked = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const topKey = ranked[0];
  const otherKeys = ranked.slice(1);
  const r = results[topKey];
  const othersHtml = otherKeys.map(k => {
    const o = results[k];
    return `<a href="/blog/director-favorites.html#${o.anchor}" class="other-item">
      <span class="other-name">${o.name}</span>
      <span class="other-arrow">代表作を見る →</span>
    </a>`;
  }).join('');

  const shareText = encodeURIComponent(`私に合う監督は「${r.name}」でした！ #ANIMEDB監督診断`);
  const shareUrl = encodeURIComponent('https://anime-db.jp/director-diagnosis.html');

  document.getElementById('resultScreen').innerHTML = `
    <div class="result-card">
      <div class="result-label">あなたに合う監督は…</div>
      <div class="result-name">${r.name}</div>
      <div class="result-desc">${r.desc}</div>
      <div class="result-works">${r.works}</div>
      <div class="result-btns">
        <a href="/blog/director-favorites.html#${r.anchor}" class="result-btn primary">代表作をもっと見る →</a>
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="result-btn share">𝕏 結果をシェア</a>
        <button class="result-btn secondary" onclick="restartQuiz()">もう一度診断する</button>
      </div>
    </div>
    <div class="other-card">
      <div class="other-title">🎬 この監督を選んだあなたには、こちらもおすすめ</div>
      <div class="other-list">${othersHtml}</div>
    </div>
  `;
  document.getElementById('resultScreen').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  startQuiz();
}
</script>
